theme:
  icon:
    edit: material/pencil 
    view: material/eye
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
      primary: white
      accent: deep orange
    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
      primary: grey
      accent: deep orange
    
  logo: images/terasky.png
  favicon: images/terasky-favicon.png
  name: material
  features:
    - content.code.copy
    - content.code.select
    - content.action.edit
    - content.action.view
    #- toc.integrate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      toc_depth: 3
repo_url: https://github.com/TeraSky-OSS/backstage-plugins
edit_uri: edit/main/docs/